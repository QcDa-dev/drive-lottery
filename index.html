<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドライブくじ｜車の座席をランダムで決める無料Webアプリ</title>
    <meta name="description" content="ドライブくじは、車の座席をランダムで決める無料のWebアプリです。座席数と人数、名前を入力するだけ。運転手の指定や、右・左ハンドルの切り替えにも対応。スマホで手軽に使えます。">
    <meta name="keywords" content="ドライブくじ,座席決め,車 席順,席替え くじ,ドライブ,旅行,座席 ランダム,席順 アプリ,QcDa Project">
    <meta name="author" content="QcDa Project">
    <link rel="canonical" href="https://qcda-dev.github.io/drive-lottery/">

    <!-- OGP -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="QcDa Project">
    <meta property="og:title" content="ドライブくじ｜車の座席をランダムで決める無料Webアプリ">
    <meta property="og:description" content="座席数と人数、名前を入力するだけで、車の座席をランダムに決めます。運転手の指定、右・左ハンドルにも対応。">
    <meta property="og:url" content="https://qcda-dev.github.io/drive-lottery/">
    <meta name="twitter:card" content="summary">

    <!-- アイコン (favicon.ico / icon.svg / apple-touch-icon.png をリポジトリ直下に置くと反映されます) -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <style>
        /* ドライブくじ専用スタイル */
        .number-input-button {
            transition: background-color 0.2s;
        }
        .number-input-button:hover {
            background-color: #dc2626; /* red-600 */
        }
        .start-button {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .seat {
            border: 2px solid #9CA3AF; /* gray-400 */
            min-height: 60px;
            position: relative;
            overflow: hidden;
        }
        .seat-driver {
            border-color: #EF4444; /* red-500 */
            background-color: #FEE2E2; /* red-100 */
        }
        .seat-name {
            font-weight: bold;
            font-size: 0.8rem;
            word-break: break-all;
        }
        .driver-icon {
            width: 1.5rem;
            height: 1.5rem;
            position: absolute;
            top: 2px;
        }
        .driver-icon.is-right { right: 2px; }
        .driver-icon.is-left { left: 2px; }

        /* ハンドル位置の切り替え */
        .steering-toggle {
            display: flex;
            border: 2px solid #D1D5DB; /* gray-300 */
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .steering-toggle label {
            cursor: pointer;
        }
        .steering-toggle input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .steering-toggle span {
            display: block;
            padding: 0.6rem 0.9rem;
            font-weight: 700;
            color: #6B7280; /* gray-500 */
            background: #fff;
            transition: background-color 0.2s, color 0.2s;
        }
        .steering-toggle input:checked + span {
            background: #EF4444;
            color: #fff;
        }
        .steering-toggle input:focus-visible + span {
            outline: 3px solid #FCA5A5; /* red-300 */
            outline-offset: -3px;
        }
    </style>
</head>
<body>

    <div id="qcda-header"></div>
    <div id="qcda-menu"></div>

    <div class="container mx-auto max-w-lg p-4 sm:p-6">
        <!-- ヘッダー下のマージン -->
        <div class="pt-6">
            <!-- 設定セクション -->
            <main class="bg-white p-6 rounded-2xl shadow-lg space-y-6">
                <h1 class="sr-only">ドライブくじ 車の座席をランダムで決める</h1>

                <!-- 座席数 -->
                <div class="flex items-center justify-between">
                    <label for="seats_num" class="text-lg font-bold text-gray-700">座席数</label>
                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="updateNumberInput('seats_num', -1)" aria-label="座席数を減らす" class="number-input-button w-10 h-10 bg-red-500 text-white text-2xl rounded-full flex items-center justify-center shadow-md">-</button>
                        <input type="number" id="seats_num" name="seats_num" value="5" min="2" class="w-20 h-12 text-center text-xl font-bold border-2 border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500">
                        <button type="button" onclick="updateNumberInput('seats_num', 1)" aria-label="座席数を増やす" class="number-input-button w-10 h-10 bg-red-500 text-white text-2xl rounded-full flex items-center justify-center shadow-md">+</button>
                    </div>
                </div>

                <!-- 人数 -->
                <div class="flex items-center justify-between">
                    <label for="people_num" class="text-lg font-bold text-gray-700">人数</label>
                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="updateNumberInput('people_num', -1)" aria-label="人数を減らす" class="number-input-button w-10 h-10 bg-red-500 text-white text-2xl rounded-full flex items-center justify-center shadow-md">-</button>
                        <input type="number" id="people_num" name="people_num" value="4" min="1" class="w-20 h-12 text-center text-xl font-bold border-2 border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500">
                        <button type="button" onclick="updateNumberInput('people_num', 1)" aria-label="人数を増やす" class="number-input-button w-10 h-10 bg-red-500 text-white text-2xl rounded-full flex items-center justify-center shadow-md">+</button>
                    </div>
                </div>

                <!-- ハンドル位置 -->
                <div class="flex items-center justify-between">
                    <span id="steering_label" class="text-lg font-bold text-gray-700">ハンドル</span>
                    <div class="steering-toggle" role="radiogroup" aria-labelledby="steering_label">
                        <label><input type="radio" name="steering" value="right" checked><span>右</span></label>
                        <label><input type="radio" name="steering" value="left"><span>左</span></label>
                    </div>
                </div>

                <!-- 名前入力フォーム -->
                <div id="lot_form" class="space-y-3">
                    <!-- ここに動的に入力フォームが生成されます -->
                </div>

                <!-- エラーメッセージ -->
                <div id="error_message" class="text-red-600 font-bold text-center" role="alert"></div>

                <!-- くじ開始ボタン -->
                <button type="button" id="start_lottery" class="start-button w-full bg-red-500 text-white text-xl font-bold py-4 rounded-xl shadow-lg">
                    くじ開始
                </button>
            </main>
        </div>

        <!-- 結果表示フィールド -->
        <section id="result_field" class="mt-8 bg-white p-6 rounded-2xl shadow-lg hidden">
            <h2 class="text-2xl font-bold text-center text-red-500 mb-6">抽選結果</h2>
            <p class="text-center text-sm text-gray-400 mb-2">▲ 車の前</p>
            <div id="car_seats" class="space-y-4">
                <!-- 車の座席がここに表示されます -->
            </div>
        </section>
    </div>

    <div id="qcda-footer"></div>

    <script src="common.js"></script>
    <script>
        // DOM要素の取得
        const peopleNumInput = document.getElementById('people_num');
        const lotForm = document.getElementById('lot_form');
        const startButton = document.getElementById('start_lottery');
        const resultField = document.getElementById('result_field');
        const errorMessage = document.getElementById('error_message');

        // +/-ボタンの処理
        function updateNumberInput(id, delta) {
            const input = document.getElementById(id);
            const min = parseInt(input.min, 10);
            let value = (parseInt(input.value, 10) || min) + delta;
            if (value < min) {
                value = min;
            }
            input.value = value;
            if (id === 'people_num') {
                generateNameInputs();
            }
        }

        peopleNumInput.addEventListener('change', generateNameInputs);

        // 名前の入力行を1行つくる
        function createNameRow(i) {
            const tr = document.createElement('tr');
            tr.className = "bg-white border-b";
            tr.innerHTML = `
                <td class="px-4 py-2">
                    <input type="text" name="name_${i}" placeholder="名前 ${i + 1}" aria-label="名前 ${i + 1}" class="w-full p-2 border border-gray-300 rounded-md focus:ring-red-500 focus:border-red-500">
                </td>
                <td class="px-4 py-2 text-center">
                    <input type="checkbox" name="driver_check" data-index="${i}" aria-label="名前 ${i + 1} を運転手にする" class="driver-checkbox w-6 h-6 text-red-600 bg-gray-100 border-gray-300 rounded focus:ring-red-500">
                </td>
            `;
            tr.querySelector('.driver-checkbox').addEventListener('change', handleDriverCheckbox);
            return tr;
        }

        // 名前の入力フォームを人数に合わせて増減する
        // (表を作り直さないので、入力済みの名前・運転手チェック・フォーカスはそのまま残る)
        function generateNameInputs() {
            const peopleNum = parseInt(peopleNumInput.value, 10) || 0;
            let table = lotForm.querySelector('table');

            if (peopleNum <= 0) {
                lotForm.innerHTML = '';
                return;
            }

            if (!table) {
                table = document.createElement('table');
                table.className = "w-full text-sm text-left text-gray-500";
                table.innerHTML = `
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th scope="col" class="px-4 py-3">名前</th>
                            <th scope="col" class="px-4 py-3 text-center">運転手</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                `;
                lotForm.appendChild(table);
            }

            const tbody = table.querySelector('tbody');
            while (tbody.rows.length < peopleNum) {
                tbody.appendChild(createNameRow(tbody.rows.length));
            }
            while (tbody.rows.length > peopleNum) {
                tbody.deleteRow(tbody.rows.length - 1);
            }
        }

        // 運転手チェックボックスの制御
        function handleDriverCheckbox(event) {
            if (event.target.checked) {
                document.querySelectorAll('.driver-checkbox').forEach(checkbox => {
                    if (checkbox !== event.target) {
                        checkbox.checked = false;
                    }
                });
            }
        }

        // 偏りのないシャッフル (Fisher-Yates)
        function shuffle(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // くじ開始ボタンの処理
        startButton.addEventListener('click', () => {
            errorMessage.textContent = ''; // エラーメッセージをクリア
            const seatsNum = parseInt(document.getElementById('seats_num').value, 10);
            const peopleNum = parseInt(peopleNumInput.value, 10);
            const steering = document.querySelector('input[name="steering"]:checked').value; // 'right' | 'left'

            // バリデーション
            if (!(peopleNum > 0)) {
                errorMessage.textContent = '人数は1以上を入力してください。';
                return;
            }
            if (!(seatsNum > 1)) {
                errorMessage.textContent = '座席数は2以上を入力してください。';
                return;
            }
            if (seatsNum < peopleNum) {
                errorMessage.textContent = '座席数より人数が多いです。';
                return;
            }

            // 参加者リストの作成
            const participants = [];
            for (let i = 0; i < peopleNum; i++) {
                const nameInput = document.querySelector(`input[name="name_${i}"]`);
                const trimmed = nameInput.value.trim();
                participants.push({ name: trimmed === '' ? `メンバー ${i + 1}` : trimmed, isDriver: false });
            }

            // 運転手の設定
            let driver = null;
            const driverCheckbox = document.querySelector('.driver-checkbox:checked');
            if (driverCheckbox) {
                const driverIndex = parseInt(driverCheckbox.dataset.index, 10);
                participants[driverIndex].isDriver = true;
                driver = participants[driverIndex];
                // 運転手を参加者リストから一時的に削除
                participants.splice(driverIndex, 1);
            }

            displayResults(driver, shuffle(participants), seatsNum, steering);
        });

        function displayResults(driver, passengers, seatsNum, steering) {
            const carSeats = document.getElementById('car_seats');
            carSeats.innerHTML = '';

            // 座席レイアウトの定義
            const seatLayouts = {
                2: [[2]], 3: [[3]], 4: [[2], [2]], 5: [[2], [3]], 6: [[2], [2], [2]],
                7: [[2], [3], [2]], 8: [[2], [3], [3]], 9: [[1], [2], [3], [3]]
            };

            let layout;
            if (seatsNum <= 9 && seatLayouts[seatsNum]) {
                layout = seatLayouts[seatsNum];
            } else { // 10人以上の場合の汎用レイアウト
                layout = [[2]];
                let remainingSeats = seatsNum - 2;
                while (remainingSeats > 0) {
                    const rowSeats = Math.min(remainingSeats, 3);
                    layout.push([rowSeats]);
                    remainingSeats -= rowSeats;
                }
            }

            // --- 抽選ロジック ---
            const passengerQueue = [...passengers];
            const seatingArrangement = []; // {row, col, person} を格納

            // 運転席の位置: 最前列の、右ハンドルなら右端・左ハンドルなら左端
            const firstRowSeatCount = layout[0][0];
            const driverRow = 0;
            const driverCol = steering === 'left' ? 0 : firstRowSeatCount - 1;

            // 1. 運転手が指定されていれば運転席に配置
            if (driver) {
                seatingArrangement.push({ row: driverRow, col: driverCol, person: driver });
            }

            // 2. 残りの座席を、優先席と中間席に分ける
            const prioritySeats = [];
            const middleSeats = [];

            layout.forEach((row, rowIndex) => {
                const seatCount = row[0];
                for (let colIndex = 0; colIndex < seatCount; colIndex++) {
                    const isDriverSeat = rowIndex === driverRow && colIndex === driverCol;
                    // 運転手が指定されている場合、運転席は確保済みなのでスキップ
                    if (isDriverSeat && driver) {
                        continue;
                    }
                    const seat = { row: rowIndex, col: colIndex };
                    if (isDriverSeat) {
                        // 運転手の指定がないときは、運転席もくじの対象 (最初に埋める)
                        prioritySeats.unshift(seat);
                    } else if (seatCount === 3 && colIndex === 1) {
                        middleSeats.push(seat);
                    } else {
                        prioritySeats.push(seat);
                    }
                }
            });

            // 3. 優先席に乗客を割り当て
            prioritySeats.forEach(seat => {
                if (passengerQueue.length > 0) {
                    seatingArrangement.push({ ...seat, person: passengerQueue.shift() });
                }
            });

            // 4. 中間席に残りの乗客を割り当て
            middleSeats.forEach(seat => {
                if (passengerQueue.length > 0) {
                    seatingArrangement.push({ ...seat, person: passengerQueue.shift() });
                }
            });

            // 描画処理
            layout.forEach((row, rowIndex) => {
                const rowDiv = document.createElement('div');
                const seatCount = row[0];
                rowDiv.className = `grid gap-2 grid-cols-${seatCount} items-center`;

                if (seatCount === 1) {
                    rowDiv.style.gridTemplateColumns = '1fr';
                    rowDiv.classList.add('w-1/3', 'mx-auto');
                }

                for (let colIndex = 0; colIndex < seatCount; colIndex++) {
                    const seatDiv = document.createElement('div');
                    seatDiv.className = 'seat flex flex-col items-center justify-center p-2 rounded-lg text-center';

                    const isDriverSeat = rowIndex === driverRow && colIndex === driverCol;
                    const seatedPerson = seatingArrangement.find(s => s.row === rowIndex && s.col === colIndex);
                    const iconSide = steering === 'left' ? 'is-left' : 'is-right';

                    if (isDriverSeat) {
                        // 運転席は、運転手の指定の有無にかかわらず常に表示する
                        seatDiv.classList.add('seat-driver');
                        const name = seatedPerson ? QcDa.escapeHtml(seatedPerson.person.name) : '';
                        const label = (seatedPerson && seatedPerson.person.isDriver) ? '運転手' : '運転席';
                        seatDiv.innerHTML = `
                            <svg class="driver-icon ${iconSide}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
                                <path fill="#EF4444" d="M344 0H168c-13.3 0-24 10.7-24 24v80c0 13.3 10.7 24 24 24h176c13.3 0 24-10.7 24-24V24c0-13.3-10.7-24-24-24zM128 224v-32c0-17.7-14.3-32-32-32s-32 14.3-32 32v32c0 17.7 14.3 32 32 32s32-14.3 32-32zm352 96h-32c-17.7 0-32-14.3-32-32v-32c0-17.7 14.3-32 32-32h32c17.7 0 32 14.3 32 32v32c0 17.7-14.3 32-32 32zM256 160c-106 0-192 86-192 192s86 192 192 192 192-86 192-192-86-192-192-192zm0 320c-70.7 0-128-57.3-128-128s57.3-128 128-128 128 57.3 128 128-57.3 128-128 128z"/>
                            </svg>
                            ${name ? `<span class="seat-name">${name}</span>` : ''}
                            <span class="text-xs text-red-500">${label}</span>`;
                    } else if (seatedPerson) {
                        seatDiv.innerHTML = `<span class="seat-name">${QcDa.escapeHtml(seatedPerson.person.name)}</span>`;
                    } else {
                        seatDiv.innerHTML = `<span class="text-gray-400">空席</span>`;
                    }
                    rowDiv.appendChild(seatDiv);
                }
                carSeats.appendChild(rowDiv);
            });

            resultField.classList.remove('hidden');
            resultField.scrollIntoView({ behavior: 'smooth' });
        }

        // 初期表示
        window.addEventListener('DOMContentLoaded', () => {
            generateNameInputs();
        });
    </script>
</body>
</html>
