<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リリースノート｜ドライブくじ</title>
    <meta name="description" content="ドライブくじのリリースノート（更新履歴）。追加された機能や修正内容を確認できます。">
    <meta name="keywords" content="ドライブくじ,リリースノート,更新履歴,QcDa Project">
    <meta name="author" content="QcDa Project">
    <meta name="robots" content="index, follow">

    <!-- アイコン (favicon.ico / icon.svg / apple-touch-icon.png をリポジトリ直下に置くと反映されます) -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <!-- marked.js: GitHub Releases の Markdown を HTML に変換 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div id="qcda-header"></div>
    <div id="qcda-menu"></div>

    <main class="container mx-auto max-w-2xl p-4 sm:p-8">
        <div class="pt-6">
            <header class="text-center my-8">
                <h1 class="text-4xl sm:text-5xl font-bold text-red-500 tracking-wider">リリースノート</h1>
            </header>
            <div id="release-notes-container" class="space-y-8">
                <!-- GitHub Releases の内容がここに表示されます -->
            </div>
            <!-- 読み込み中の表示 -->
            <div id="loadingIndicator" class="text-center py-10">
                <svg class="animate-spin h-8 w-8 text-red-500 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-2 text-gray-600">読み込み中...</p>
            </div>
        </div>
    </main>

    <div id="qcda-footer"></div>

    <script src="common.js"></script>
    <script>
        // GitHub Releases からリリースノートを取得して表示 (取得元は common.js の QCDA_CONFIG.repo)
        document.addEventListener('DOMContentLoaded', () => {
            const { user, name } = QcDa.config.repo;
            const container = document.getElementById('release-notes-container');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const apiUrl = `https://api.github.com/repos/${user}/${name}/releases`;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Network response was not ok: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(releases => {
                    loadingIndicator.classList.add('hidden');
                    if (releases.length === 0) {
                        container.innerHTML = '<p class="text-center text-gray-500">リリース情報はまだありません。</p>';
                        return;
                    }

                    releases.forEach(release => {
                        const releaseDate = new Date(release.published_at || release.created_at).toLocaleDateString('ja-JP');
                        const releaseBodyHtml = marked.parse(release.body || '');

                        const releaseElement = document.createElement('div');
                        releaseElement.className = 'bg-white p-6 rounded-2xl shadow-lg';
                        releaseElement.innerHTML = `
                            <div class="flex justify-between items-center mb-3 border-b pb-3">
                                <h2 class="text-2xl font-bold text-gray-800">${QcDa.escapeHtml(release.name || release.tag_name)}</h2>
                                <span class="text-sm text-gray-500 flex-shrink-0 ml-4">${releaseDate}</span>
                            </div>
                            <div class="qc-release-content text-gray-700">${releaseBodyHtml}</div>
                        `;
                        container.appendChild(releaseElement);
                    });
                })
                .catch(error => {
                    loadingIndicator.classList.add('hidden');
                    console.error('Error fetching release notes:', error);
                    container.innerHTML = '<p class="text-center text-red-500">リリース情報の取得に失敗しました。リポジトリが非公開、または指定したユーザー/リポジトリ名が間違っている可能性があります。</p>';
                });
        });
    </script>
</body>
</html>
